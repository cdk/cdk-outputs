site_name: Software & services
site_description: >-
  The software, data resources and services from the Chemistry Development Kit ecosystem.
site_url: https://cdk.github.io/cdk-outputs/
repo_url: https://github.com/cdk/cdk-outputs
repo_name: cdk/cdk-outputs
edit_uri: ""
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  # The department's own mark, in the white version, because the header is UM's dark
  # blue in both light and dark mode. Both files are in the repository -- nothing here
  # is fetched at render time.
  logo: assets/images/logos/cdk.png
  favicon: assets/images/cdk_favicon.ico
  # UM's house style specifies Thesis Sans, which is licensed and cannot be shipped.
  # The university's own web guidance names Open Sans as its approved substitute, so
  # that is what the site uses -- served from assets/fonts/, not from Google, which
  # keeps the page free of third-party requests and archivable in one piece.
  font: false
  features:
    # No navigation.tabs: three sections do not need a bar of their own, so
    # overrides/partials/header.html puts them in the header row instead. The header
    # is sticky on its own, which is what keeps them on screen.
    - navigation.top
    - content.code.copy
    - toc.follow
  # `custom` hands the palette to assets/css/extra.css, where the UM house-style
  # colours are defined once with their contrast ratios recorded.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Switch to light mode}

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets: {base_path: [includes], check_paths: true}

extra_css:
  - assets/css/extra.css
# Vendored and pinned rather than loaded from a CDN, so the page keeps working
# unchanged in five years and can be archived intact. Versions and SHA-384 hashes
# are recorded on the methodology page.
extra_javascript:
  - assets/js/vega.min.js
  - assets/js/vega-lite.min.js
  - assets/js/vega-embed.min.js
  - assets/js/charts.js

extra:
  social:
    - icon: fontawesome/solid/building-columns
      link: https://www.maastrichtuniversity.nl/research/translational-genomics
      name: Department of Translational Genomics

nav:
  - Overview: index.md
  - Methods: methods.md
  - About: about.md

copyright: >-
  Code MIT. Figures are derived aggregates of public data; the Methods page credits
  every source. Modelled on
  <a href="https://github.com/RECETOX/specdatri_reporting">RECETOX/specdatri_reporting</a>.
  This page measures software, not people. It is not, and must not be
  used as, an assessment of individuals.
