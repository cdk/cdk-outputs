name: A collector is failing
description: A source shows as degraded or failed on the status page.
labels: ["collector"]
body:
  - type: input
    id: source
    attributes:
      label: Which source?
      placeholder: "bioconductor"
    validations: {required: true}
  - type: textarea
    id: error
    attributes:
      label: Error text
      description: From the status page, or from `manifests/<date>.json` on the data branch.
      render: text
    validations: {required: true}
  - type: markdown
    attributes:
      value: "See [RUNBOOK.md](https://github.com/TGX-UM/tgx-outputs/blob/main/RUNBOOK.md) for the decision tree."
